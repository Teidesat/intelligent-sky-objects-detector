services:
  download:
    build: .
    image: sky-detector
    command: python src/dataset_downloader/dataset_downloader.py
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - ASTROMETRY_API_KEY=${ASTROMETRY_API_KEY}

  train:
    build: .
    image: sky-detector
    command: python -m src.model_training.train --dataset /app/data/dataset --output /app/data/trained-models/model.keras --performance /app/data/performance
    user: root
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    runtime: nvidia
    environment:
      - ASTROMETRY_API_KEY=${ASTROMETRY_API_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
      - XLA_FLAGS=--xla_gpu_force_compilation_parallelism=1
      - TF_XLA_FLAGS=--tf_xla_auto_jit=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  infer:
    build: .
    image: sky-detector
    command: >
      python -m src.model_applications.run_inference
      --model /app/data/trained-models/model.keras
      --image /app/data/dataset/sample/sample-image.fits
      --output /app/data/performance/infer_result.png
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - ASTROMETRY_API_KEY=${ASTROMETRY_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  eval:
    build: .
    image: sky-detector
    command: >
      python -m src.model_applications.run_evaluation
      --model /app/data/trained-models/model.keras
      --dataset /app/data/dataset/
      --output /app/data/performance/
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - ASTROMETRY_API_KEY=${ASTROMETRY_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]